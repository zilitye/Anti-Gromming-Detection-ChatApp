plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.chatapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.chatapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    buildFeatures {
        viewBinding true
    }

    // Keep the bundled ONNX model uncompressed in the APK so it can be
    // copied out and opened as a plain file by ONNX Runtime.
    androidResources {
        noCompress += "onnx"
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.firebase.firestore
    implementation libs.firebase.inappmessaging.display
    implementation libs.material

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit

    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.intuit.ssp:ssp-android:1.0.6'

    implementation 'com.makeramen:roundedimageview:2.3.0'

    // Firebase Messaging
    implementation libs.firebase.messaging

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-scalars:3.0.0'

    // Markwon
    implementation libs.markwon.core

    // Local, on-device NLP grooming detection: sentence-embedding model
    // (all-MiniLM-L6-v2) running fully on-device through ONNX Runtime.
    // See https://github.com/shubham0204/Sentence-Embeddings-Android
    implementation 'io.gitlab.shubham0204:sentence-embeddings:v6'
    implementation libs.kotlinx.coroutines.android
}